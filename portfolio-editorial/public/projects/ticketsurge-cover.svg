<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="t d">
  <title id="t">TicketSurge — concurrency-safe flash-sale ticketing</title>
  <desc id="d">Illustration of TicketSurge: a 40-seat map under a flash sale, the Redis-hold, row-lock, queue and WebSocket booking flow, and the Locust load-test results.</desc>
