<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="t d">
  <title id="t">CiteFrontier — streaming non-generative RAG</title>
  <desc id="d">Illustration of CiteFrontier: a disfluent live transcript split into two intents, hybrid BM25 and MiniLM retrieval with cross-encoder reranking and revalidation, and cited answers with an explicit abstention.</desc>
  <defs>
    <radialGradient id="glowSage" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#7fb8a8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#7fb8a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLav" cx="88%" cy="12%" r="45%">
      <stop offset="0" stop-color="#9c94cf" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#9c94cf" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fb8a8"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", Consolas, "Courier New", monospace; }
      .ink { fill: #f5f5f2; }
      .muted { fill: #8a8a86; }
      .sage { fill: #7fb8a8; }
      .card { fill: #171b24; stroke: rgba(245,245,242,0.14); stroke-width: 1.5; }
      .inset { fill: #12151c; stroke: rgba(245,245,242,0.14); stroke-width: 1.5; }
      .rule { stroke: rgba(245,245,242,0.14); stroke-width: 1.5; }
      .chip { fill: rgba(127,184,168,0.10); stroke: rgba(127,184,168,0.45); stroke-width: 1.5; }
      .chipLav { fill: rgba(156,148,207,0.10); stroke: rgba(156,148,207,0.5); stroke-width: 1.5; }
      .node { fill: #171b24; stroke: rgba(127,184,168,0.45); stroke-width: 1.5; }
      .track { fill: rgba(245,245,242,0.08); }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#12151c"/>
  <rect width="1600" height="1200" fill="url(#glowSage)"/>
  <rect width="1600" height="1200" fill="url(#glowLav)"/>

  <text x="120" y="222" class="sans ink" font-size="34" font-weight="800" letter-spacing="-1">CITEFRONTIER</text>
  <text x="1480" y="216" class="mono muted" font-size="18" letter-spacing="3" text-anchor="end">STREAMING NON-GENERATIVE RAG</text>
  <line x1="120" y1="252" x2="1480" y2="252" class="rule"/>

  <rect x="120" y="300" width="520" height="480" rx="14" class="card"/>
  <rect x="960" y="300" width="520" height="480" rx="14" class="card"/>
  <text x="152" y="348" class="mono muted" font-size="18" letter-spacing="3" text-anchor="start">01 — LIVE TRANSCRIPT</text>
  <rect x="152" y="374" width="456" height="170" rx="10" class="inset"/>
  <text class="sans ink" font-size="25">
    <tspan x="178" y="424">uh, when does the warranty</tspan>
    <tspan x="178" y="464">start, and— sorry— how do</tspan>
    <tspan x="178" y="504">I file a claim?</tspan>
  </text>
  <rect x="342" y="481" width="3" height="31" class="sage"/>
  <text x="152" y="586" class="mono muted" font-size="16" letter-spacing="3">INTENTS</text>
  <rect x="152" y="604" width="290" height="42" rx="21" class="chip"/>
  <text x="170" y="631" class="mono ink" font-size="17">1 · warranty start</text>
  <rect x="152" y="658" width="290" height="42" rx="21" class="chipLav"/>
  <text x="170" y="685" class="mono ink" font-size="17">2 · file a claim</text>
  <text x="152" y="750" class="mono muted" font-size="15" letter-spacing="1">stable intent → early retrieval</text>
  <text x="800" y="348" class="mono muted" font-size="18" letter-spacing="2" text-anchor="middle">02 — RETRIEVE</text>
  <rect x="690" y="384" width="100" height="44" rx="10" class="node"/>
  <text x="740.0" y="411.0" class="mono ink" font-size="15" letter-spacing="1" text-anchor="middle">BM25</text>
  <rect x="810" y="384" width="100" height="44" rx="10" class="node"/>
  <text x="860.0" y="411.0" class="mono ink" font-size="15" letter-spacing="1" text-anchor="middle">MiniLM</text>
  <path d="M740 428 L740 452 L800 452 L800 476" fill="none" stroke="#7fb8a8" stroke-width="2"/>
  <path d="M860 428 L860 452 L800 452" fill="none" stroke="#7fb8a8" stroke-width="2"/>
  <line x1="800" y1="452" x2="800" y2="478" stroke="#7fb8a8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="690" y="484" width="220" height="44" rx="10" class="node"/>
  <text x="800.0" y="511.0" class="mono ink" font-size="15" letter-spacing="1" text-anchor="middle">CROSS-ENCODER</text>
  <line x1="800" y1="528" x2="800" y2="556" stroke="#7fb8a8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="690" y="562" width="220" height="44" rx="10" class="node"/>
  <text x="800.0" y="589.0" class="mono ink" font-size="15" letter-spacing="1" text-anchor="middle">REVALIDATE</text>
  <line x1="646" y1="406" x2="684" y2="406" stroke="#7fb8a8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="916" y1="584" x2="954" y2="584" stroke="#7fb8a8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="656" class="mono muted" font-size="15" text-anchor="middle">stale results</text>
  <text x="800" y="680" class="mono muted" font-size="15" text-anchor="middle">rejected</text>
  <text x="992" y="348" class="mono muted" font-size="18" letter-spacing="3" text-anchor="start">03 — CITED ANSWER</text>
  <rect x="1307.0" y="320" width="154" height="38" rx="19" fill="rgba(127,184,168,0.14)" stroke="#7fb8a8" stroke-width="1.5"/>
  <text x="1384" y="345" class="mono" fill="#7fb8a8" font-size="16" letter-spacing="1" text-anchor="middle">0 FABRICATED</text>
  <text x="992" y="392" class="mono" fill="#7fb8a8" font-size="14" letter-spacing="2">INTENT 1</text>
  <text x="992" y="426" class="sans ink" font-size="20">Coverage starts on the delivery date.</text>
  <rect x="992" y="442" width="183" height="32" rx="16" class="chip"/>
  <text x="1007" y="463" class="mono ink" font-size="15">policy.pdf · §2.1</text>
  <text x="992" y="508" class="mono" fill="#9c94cf" font-size="14" letter-spacing="2">INTENT 2</text>
  <text x="992" y="542" class="sans ink" font-size="20">File claims through the support portal.</text>
  <rect x="992" y="558" width="165" height="32" rx="16" class="chipLav"/>
  <text x="1007" y="579" class="mono ink" font-size="15">support.md · §4</text>
  <text x="992" y="628" class="mono muted" font-size="14" letter-spacing="2">FOLLOW-UP</text>
  <rect x="992" y="642" width="250" height="32" rx="16" fill="none" stroke="rgba(245,245,242,0.3)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="1007" y="663" class="mono muted" font-size="15">ABSTAIN · not in corpus</text>
  <line x1="992" y1="700" x2="1448" y2="700" class="rule"/>
  <text x="992" y="732" class="mono muted" font-size="14" letter-spacing="1">90/90 supported extracts · 15/15 intents</text>
  <text x="992" y="756" class="mono muted" font-size="14" letter-spacing="1">60/60 replays · 92.5% early retrieval</text>

  <line x1="120" y1="860" x2="1480" y2="860" class="rule"/>
  <text x="120" y="902" class="mono muted" font-size="16" letter-spacing="1">Answers are exact source extracts with citations, or explicit abstentions</text>
  <text x="1480" y="902" class="mono muted" font-size="16" letter-spacing="1" text-anchor="end">DISTILBERT · BM25 · MINILM · FAISS</text>
</svg>
